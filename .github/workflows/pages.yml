name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "1"
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx next build
      - run: node scripts/prefix-static-assets.mjs .next-static "$PAGES_BASE_PATH"
      - run: mv .next-static site
      # Arabic copy under /ar; it shares the English copy's public assets.
      - run: npx next build
        env:
          STATIC_LOCALE: ar
      - run: node scripts/prefix-static-assets.mjs .next-static "$PAGES_BASE_PATH"
      - run: |
          cd .next-static
          rm -rf brochures design images svg video videos favicon.ico lepas-logo.svg
          cd ..
          mv .next-static site/ar
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
